<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Random Spotify</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;padding:24px}.app{width:min(520px,100%);text-align:center}.cover{width:100%;aspect-ratio:1;border-radius:28px;object-fit:cover;background:#181818;box-shadow:0 20px 70px #000}.title{font-size:28px;font-weight:800;margin:22px 0 5px}.artist{color:#aaa;font-size:18px;margin-bottom:24px}.btn{width:100%;border:0;border-radius:999px;padding:18px;font-size:18px;font-weight:800;margin:7px 0;text-decoration:none;display:block}.green{background:#1ed760;color:#07150b}.dark{background:#222;color:#fff}.status{color:#888;font-size:14px;line-height:1.4;margin:16px}.logo{font-size:34px;font-weight:900;margin-bottom:24px}.timeline{margin:4px 2px 18px}.times{display:flex;justify-content:space-between;color:#aaa;font-size:13px;margin-top:5px}.seek{width:100%;accent-color:#1ed760}.lyrics{white-space:pre-wrap;text-align:left;font-size:18px;line-height:1.75;background:#151515;border-radius:22px;padding:22px;margin:18px 0}.hide{display:none}</style></head>
<body><main class="app"><div class="logo">RANDOM SPOTIFY</div>
<section id="login"><p>Spotify 전체 카탈로그를 무작위로 탐색합니다.<br>좋아요/플레이리스트는 사용하지 않습니다.</p><button class="btn green" id="loginBtn">Spotify 로그인</button></section>
<section id="player" class="hide"><img class="cover" id="cover"><div class="title" id="name">Ready</div><div class="artist" id="artist">—</div><div class="timeline"><input class="seek" id="seek" type="range" min="0" max="1000" value="0"><div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div></div><button class="btn green" id="random">🎲 RANDOM</button><a class="btn dark" id="open" target="_blank">Spotify에서 열기</a><div class="status" id="status">버튼을 눌러 랜덤곡을 뽑아.</div><div class="lyrics hide" id="lyrics"></div></section></main>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
let webPlayer=null, deviceId=null, sdkReady=false;
window.onSpotifyWebPlaybackSDKReady=()=>{sdkReady=true; if(localStorage.t) initPlayer();};
async function initPlayer(){if(webPlayer||!window.Spotify)return;webPlayer=new Spotify.Player({name:"Random Spotify iPad",getOAuthToken:async cb=>cb(await getToken()),volume:0.8,enableMediaSession:true});webPlayer.addListener("player_state_changed",s=>{if(!s)return;updateTimeline(s.position,s.duration);});webPlayer.addListener("ready",({device_id})=>{deviceId=device_id; $("status").textContent="웹 플레이어 준비 완료";});webPlayer.addListener("account_error",()=>{$("status").textContent="웹 재생에는 Spotify Premium이 필요해.";});webPlayer.addListener("authentication_error",({message})=>{$("status").textContent="인증 오류: "+message;});webPlayer.addListener("playback_error",({message})=>{$("status").textContent="재생 오류: "+message;});webPlayer.addListener("autoplay_failed",()=>{$("status").textContent="iPad가 자동재생을 막았어. RANDOM을 한 번 더 눌러줘.";});await webPlayer.connect();}
function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0")}function updateTimeline(p,d){$("pos").textContent=fmt(p||0);$("dur").textContent=fmt(d||0);$("seek").value=d?Math.round(p/d*1000):0}$("seek").addEventListener("change",async e=>{if(!webPlayer)return;let s=await webPlayer.getCurrentState();if(s)await webPlayer.seek(s.duration*(+e.target.value/1000));});setInterval(async()=>{if(!webPlayer)return;let s=await webPlayer.getCurrentState();if(s)updateTimeline(s.position,s.duration)},1000);
async function loadLyrics(track){let box=$("lyrics");box.classList.add("hide");box.textContent="";try{let artist=track.artists?.[0]?.name||"",album=track.album?.name||"",u="https://lrclib.net/api/get?"+new URLSearchParams({track_name:track.name,artist_name:artist,album_name:album,duration:Math.round(track.duration_ms/1000)}),r=await fetch(u);if(!r.ok)return;let d=await r.json(),txt=d.plainLyrics||"";if(txt.trim()){box.textContent=txt.trim();box.classList.remove("hide")}}catch(e){}}
async function forceReauth(){localStorage.removeItem("t");localStorage.removeItem("r");localStorage.removeItem("exp");sessionStorage.clear();location.reload();}
async function playHere(uri){if(!webPlayer)await initPlayer();if(!deviceId)throw Error("웹 플레이어 준비 중이야. 잠시 후 다시 눌러줘.");await webPlayer.activateElement();let t=await getToken();let r=await fetch(API+"/me/player/play?device_id="+encodeURIComponent(deviceId),{method:"PUT",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({uris:[uri]})});if(!r.ok){let x=await r.text();if(r.status===401&&(x.includes("Permissions missing")||x.includes("permission"))){localStorage.removeItem("t");localStorage.removeItem("r");localStorage.removeItem("exp");throw Error("재생 권한을 새로 받아야 해. 페이지를 새로고침한 뒤 Spotify 로그인을 다시 눌러줘.");}throw Error("재생 시작 실패 ("+r.status+") "+x);}}
const CLIENT_ID="566e82bf871c4c60aceee473d9d1d83c";
const REDIRECT="https://yurethn.github.io/spotify/";
const AUTH_VERSION="2";
if(localStorage.authVersion!==AUTH_VERSION){localStorage.removeItem("t");localStorage.removeItem("r");localStorage.removeItem("exp");localStorage.authVersion=AUTH_VERSION;}
const A="https://accounts.spotify.com", API="https://api.spotify.com/v1";
const $=x=>document.getElementById(x), ri=n=>Math.floor(Math.random()*n);
function rnd(n=64){let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~",a=new Uint32Array(n),s="";crypto.getRandomValues(a);a.forEach(v=>s+=c[v%c.length]);return s}
async function hash(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s))}
function b64(b){return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
$("loginBtn").onclick=async()=>{let v=rnd(96),state=rnd(30);sessionStorage.v=v;sessionStorage.state=state;let ch=b64(await hash(v));location.href=A+"/authorize?"+new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT,scope:"streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state",code_challenge_method:"S256",code_challenge:ch,state})};
async function token(code){let r=await fetch(A+"/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:sessionStorage.v})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.error);localStorage.t=d.access_token;localStorage.exp=Date.now()+(d.expires_in-30)*1000;if(d.refresh_token)localStorage.r=d.refresh_token}
async function getToken(){if(localStorage.t&&Date.now()<+localStorage.exp)return localStorage.t;if(!localStorage.r)return null;let r=await fetch(A+"/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"refresh_token",refresh_token:localStorage.r})}),d=await r.json();if(!r.ok)return null;localStorage.t=d.access_token;localStorage.exp=Date.now()+(d.expires_in-30)*1000;return d.access_token}
async function api(p){let t=await getToken(),r=await fetch(API+p,{headers:{Authorization:"Bearer "+t}}),d=await r.json();if(!r.ok)throw Error(d.error?.message||"Spotify API error");return d}
const seeds=["a","e","i","o","u","b","c","d","f","g","h","j","k","l","m","n","p","r","s","t","w","y","가","나","다","라","마","사","아","愛","夜","the","love","blue","moon","1","2","3","7","9"];
async function randomTrack(){let st=$("status");st.textContent="랜덤 탐색 중…";try{let track=null;for(let tries=0;tries<8&&!track;tries++){let q=seeds[ri(seeds.length)],f=await api("/search?type=track&limit=10&q="+encodeURIComponent(q));let total=f.tracks?.total||0;if(!total)continue;let max=Math.min(Math.max(total-10,0),990),off=max?ri(Math.floor(max/10)+1)*10:0,d=off?await api("/search?type=track&limit=10&offset="+off+"&q="+encodeURIComponent(q)):f,items=d.tracks?.items||[];if(items.length)track=items[ri(items.length)]}if(!track)throw Error("곡을 못 찾았어. 다시 눌러줘.");$("cover").src=track.album?.images?.[0]?.url||"";$("name").textContent=track.name;$("artist").textContent=track.artists.map(x=>x.name).join(", ");$("open").href=track.external_urls.spotify;updateTimeline(0,track.duration_ms);loadLyrics(track);st.textContent="재생 시작 중…";await playHere(track.uri);st.textContent="▶ 사이트에서 재생 중"}catch(e){st.textContent=e.message}}
$("random").onclick=randomTrack;
(async()=>{try{let p=new URLSearchParams(location.search),code=p.get("code");if(code){if(p.get("state")!==sessionStorage.state)throw Error("로그인 검증 실패");await token(code);history.replaceState({},"",REDIRECT)}if(await getToken()){$("login").classList.add("hide");$("player").classList.remove("hide");if(sdkReady)await initPlayer()}}catch(e){alert(e.message)}})();
</script></body></html>
