<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Random Spotify</title>
<style>
*{box-sizing:border-box}
:root{--bg:#090909;--panel:#121212;--panel2:#181818;--muted:#a7a7a7;--green:#1ed760;--white:#fff}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;background:
radial-gradient(1200px 700px at 50% -120px,rgba(30,215,96,.18),transparent 55%),
linear-gradient(180deg,#111 0%,#090909 45%,#050505 100%);padding:22px}
.app{width:min(620px,100%);margin:0 auto;padding-bottom:40px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:900;letter-spacing:-.5px;font-size:22px}
.badge{font-size:12px;color:#8f8f8f;background:#151515;border:1px solid #242424;padding:7px 10px;border-radius:999px}
.card{background:linear-gradient(180deg,rgba(30,30,30,.95),rgba(15,15,15,.98));border:1px solid #242424;border-radius:30px;padding:20px;box-shadow:0 28px 80px rgba(0,0,0,.45);backdrop-filter:blur(20px)}
.coverWrap{position:relative;isolation:isolate}.coverGlow{position:absolute;inset:8%;z-index:-1;filter:blur(52px);opacity:.42;border-radius:40px;transform:scale(1.12);transition:background .4s ease}
.cover{width:100%;aspect-ratio:1;border-radius:22px;object-fit:cover;background:#181818;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.nowpill{position:absolute;left:14px;top:14px;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}
.title{font-size:30px;line-height:1.08;font-weight:900;letter-spacing:-.8px;margin:20px 0 7px;text-align:left}
.artist{color:#b6b6b6;font-size:17px;text-align:left;margin-bottom:18px}
.timeline{margin:8px 0 14px}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:linear-gradient(to right,var(--green) 0%,var(--green) var(--seek-pct,0%),#3a3a3a var(--seek-pct,0%),#3a3a3a 100%);border:0;border-radius:999px;outline:0;touch-action:none}
.seek::-webkit-slider-runnable-track{height:6px;background:transparent;border:0}
.seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--green);border:0;box-shadow:none;opacity:0;transition:opacity .12s}
.seek.dragging::-webkit-slider-thumb{opacity:1}
.seek::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--green);border:0;opacity:0}
.seek.dragging::-moz-range-thumb{opacity:1}
.times{display:flex;justify-content:space-between;color:#929292;font-size:12px;margin-top:4px}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:8px 0 16px}
.iconBtn{border:0;background:#222;color:#fff;border-radius:999px;width:52px;height:52px;font-size:22px;font-weight:800}
.randomBtn{border:0;background:var(--green);color:#08120b;border-radius:999px;padding:17px 24px;font-size:17px;font-weight:900;box-shadow:0 10px 30px rgba(30,215,96,.2)}
.openBtn{display:block;text-decoration:none;text-align:center;background:#202020;color:#fff;border-radius:999px;padding:14px;font-weight:800;margin-top:10px}
.status{color:#8c8c8c;font-size:13px;line-height:1.5;margin:14px 2px 0}
.lyricsCard{margin-top:18px;background:linear-gradient(180deg,#1a1a1a,#111);border:1px solid #242424;border-radius:28px;padding:22px;max-height:52vh;overflow:auto;text-align:left}
.lyricsHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lyricsHead h2{font-size:22px;margin:0}
.lyricsHint{font-size:12px;color:#777}
.lyricLine{font-size:24px;line-height:1.34;font-weight:800;color:#666;margin:12px 0;transition:.18s ease;cursor:pointer}
.lyricLine.active{color:#fff;transform:scale(1.01);transform-origin:left center}
.lyricLine.past{color:#a8a8a8}
.plainLyrics{white-space:pre-wrap;font-size:18px;line-height:1.75;color:#ddd}
.loginBox{text-align:center;padding:34px 16px}
.loginBox p{color:#aaa;line-height:1.55}
.loginBtn{width:100%;border:0;background:var(--green);color:#07130b;border-radius:999px;padding:17px;font-size:17px;font-weight:900}
.hide{display:none!important}
@media (min-width:800px){.card{padding:26px}.cover{border-radius:26px}}
</style></head>
<body><main class="app">
<div class="topbar"><div class="brand">Random Spotify</div><div class="badge">v8 · seek + lyrics fixes</div></div>
<div class="card">
<section id="login" class="loginBox">
<p>Spotify 카탈로그를 무작위로 탐색하고 이 페이지 안에서 재생합니다.</p>
<button class="loginBtn" id="loginBtn">Spotify 로그인</button>
</section>
<section id="player" class="hide">
<div class="coverWrap"><div class="coverGlow" id="coverGlow"></div><img class="cover" id="cover" crossorigin="anonymous"><div class="nowpill">NOW PLAYING</div></div>
<div class="title" id="name">Ready</div>
<div class="artist" id="artist">—</div>
<div class="timeline"><input class="seek" id="seek" type="range" min="0" max="1000" value="0"><div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div></div>
<div class="controls">
<button class="iconBtn" id="prevRandom" aria-label="previous random">↺</button>
<button class="randomBtn" id="random">🎲 RANDOM</button>
<button class="iconBtn" id="playPause" aria-label="play pause">⏯</button>
</div>
<a class="openBtn" id="open" target="_blank">Spotify에서 열기</a>
<div class="status" id="status">버튼을 눌러 랜덤곡을 뽑아.</div>
<div class="lyricsCard hide" id="lyricsCard">
<div class="lyricsHead"><h2>Lyrics</h2><div class="lyricsHint" id="lyricsHint"></div></div>
<div id="lyrics"></div>
</div>
</section>
</div>
</main>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
const $=x=>document.getElementById(x), ri=n=>Math.floor(Math.random()*n);
let webPlayer=null, deviceId=null, sdkReady=false;
window.onSpotifyWebPlaybackSDKReady=()=>{sdkReady=true; if(localStorage.t) initPlayer();};
async function initPlayer(){if(webPlayer||!window.Spotify)return;webPlayer=new Spotify.Player({name:"Random Spotify iPad",getOAuthToken:async cb=>cb(await getToken()),volume:0.8,enableMediaSession:true});webPlayer.addListener("player_state_changed",s=>{if(!s)return;updateTimeline(s.position,s.duration);});webPlayer.addListener("ready",({device_id})=>{deviceId=device_id; $("status").textContent="웹 플레이어 준비 완료";});webPlayer.addListener("account_error",()=>{$("status").textContent="웹 재생에는 Spotify Premium이 필요해.";});webPlayer.addListener("authentication_error",({message})=>{$("status").textContent="인증 오류: "+message;});webPlayer.addListener("playback_error",({message})=>{$("status").textContent="재생 오류: "+message;});webPlayer.addListener("autoplay_failed",()=>{$("status").textContent="iPad가 자동재생을 막았어. RANDOM을 한 번 더 눌러줘.";});await webPlayer.connect();}
function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0")}
let syncedLines=[], currentLyricIndex=-1;
function updateTimeline(p,d){if(seekDragging)return;
  $("pos").textContent=fmt(p||0);$("dur").textContent=fmt(d||0);const pct=d?Math.round(p/d*1000):0;$("seek").value=pct;$("seek").style.setProperty("--seek-pct",(pct/10)+"%");
  updateLiveLyrics(p||0);
}
let seekDragging=false;
$("seek").addEventListener("pointerdown",()=>{seekDragging=true;$("seek").classList.add("dragging")});
$("seek").addEventListener("input",async e=>{
  const s=await webPlayer?.getCurrentState(); if(!s)return;
  const target=s.duration*(+e.target.value/1000);
  $("pos").textContent=fmt(target);
  $("seek").style.setProperty("--seek-pct",((+e.target.value)/10)+"%");
});
$("seek").addEventListener("change",async e=>{
  try{const s=await webPlayer?.getCurrentState();if(s)await webPlayer.seek(s.duration*(+e.target.value/1000))}
  finally{seekDragging=false;$("seek").classList.remove("dragging")}
});
$("seek").addEventListener("pointerup",()=>{$("seek").classList.remove("dragging");seekDragging=false});
setInterval(async()=>{if(!webPlayer)return;let s=await webPlayer.getCurrentState();if(s)updateTimeline(s.position,s.duration)},500);

function parseLRC(text){
  return text.split("\n").map(line=>{
    const m=line.match(/^\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]\s*(.*)$/);
    if(!m)return null;
    const ms=(+m[1]*60 + +m[2])*1000 + +(m[3]||0)*Math.pow(10,3-(m[3]||"").length);
    return {ms,text:m[4].trim()};
  }).filter(x=>x&&x.text);
}
function renderSyncedLyrics(lines){
  const box=$("lyrics"); box.innerHTML="";
  syncedLines=lines; currentLyricIndex=-1;
  lines.forEach((line,i)=>{
    const div=document.createElement("div");
    div.className="lyricLine";
    div.textContent=line.text;
    div.dataset.i=i;
    div.onclick=async()=>{try{if(!webPlayer)return;await webPlayer.activateElement();await webPlayer.seek(Math.max(0,line.ms));updateTimeline(line.ms,(await webPlayer.getCurrentState())?.duration||0)}catch(e){$("status").textContent="이 가사 위치로 이동하지 못했어."}};
    box.appendChild(div);
  });
}
function updateLiveLyrics(position){
  if(!syncedLines.length)return;
  let idx=-1;
  for(let i=0;i<syncedLines.length;i++){if(position>=syncedLines[i].ms)idx=i;else break}
  if(idx===currentLyricIndex)return;
  currentLyricIndex=idx;
  const els=[...$("lyrics").querySelectorAll(".lyricLine")];
  els.forEach((el,i)=>{el.classList.toggle("active",i===idx);el.classList.toggle("past",i<idx)});
  const active=els[idx];if(active){const card=$("lyricsCard");card.scrollTo({top:Math.max(0,active.offsetTop-card.clientHeight/2+active.clientHeight/2),behavior:"smooth"});}
}
function albumGlow(img,url){
  const glow=$("coverGlow");
  // Try canvas extraction first.
  const cv=document.createElement("canvas");cv.width=cv.height=24;const x=cv.getContext("2d");
  const fallback=()=>{
    let h=0;for(const ch of (url||""))h=(h*31+ch.charCodeAt(0))>>>0;
    const hue=h%360;
    glow.style.background="radial-gradient(circle,hsla("+hue+",72%,54%,.95),hsla("+hue+",72%,40%,.42) 42%,transparent 72%)";
  };
  const run=()=>{try{
    x.drawImage(img,0,0,24,24);const d=x.getImageData(0,0,24,24).data;let r=0,g=0,b=0,w=0;
    for(let i=0;i<d.length;i+=4){if(d[i+3]<120)continue;const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);const sat=mx-mn;const wt=.3+sat/255;r+=d[i]*wt;g+=d[i+1]*wt;b+=d[i+2]*wt;w+=wt}
    if(!w)return fallback();
    r=Math.round(r/w);g=Math.round(g/w);b=Math.round(b/w);
    glow.style.background="radial-gradient(circle,rgba("+r+","+g+","+b+",.98),rgba("+r+","+g+","+b+",.46) 42%,transparent 72%)";
  }catch(e){fallback()}};
  if(img.complete)run();else img.addEventListener("load",run,{once:true});
}
async function loadLyrics(track){
  const card=$("lyricsCard"),box=$("lyrics"),hint=$("lyricsHint");
  card.classList.add("hide");box.innerHTML="";hint.textContent="";syncedLines=[];currentLyricIndex=-1;
  try{
    const artist=track.artists?.[0]?.name||"",album=track.album?.name||"",duration=Math.round(track.duration_ms/1000);
    const candidates=[];
    const queries=[
      {track_name:track.name,artist_name:artist,album_name:album,duration},
      {track_name:track.name,artist_name:artist,duration},
      {track_name:track.name,artist_name:artist},
      {q:track.name+" "+artist}
    ];
    for(const q of queries){
      const endpoint=q.q?"/api/search?":"/api/get?";
      const r=await fetch("https://lrclib.net"+endpoint+new URLSearchParams(q));
      if(!r.ok)continue;
      const d=await r.json();
      if(Array.isArray(d)) candidates.push(...d);
      else if(d) candidates.push(d);
      if(candidates.some(x=>x.syncedLyrics||x.plainLyrics)) break;
    }
    const best=candidates.find(x=>x.syncedLyrics)||candidates.find(x=>x.plainLyrics);
    if(!best)return;
    if(best.syncedLyrics){
      const lines=parseLRC(best.syncedLyrics);
      if(lines.length){renderSyncedLyrics(lines);hint.textContent="실시간";card.classList.remove("hide");return}
    }
    if(best.plainLyrics?.trim()){
      const pre=document.createElement("div");pre.className="plainLyrics";pre.textContent=best.plainLyrics.trim();box.appendChild(pre);
      hint.textContent="가사";card.classList.remove("hide");
    }
  }catch(e){}
}
async function forceReauth(){localStorage.removeItem("t");localStorage.removeItem("r");localStorage.removeItem("exp");sessionStorage.clear();location.reload();}
async function playHere(uri){if(!webPlayer)await initPlayer();if(!deviceId)throw Error("웹 플레이어 준비 중이야. 잠시 후 다시 눌러줘.");await webPlayer.activateElement();let t=await getToken();let r=await fetch(API+"/me/player/play?device_id="+encodeURIComponent(deviceId),{method:"PUT",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({uris:[uri]})});if(!r.ok){let x=await r.text();if(r.status===401&&(x.includes("Permissions missing")||x.includes("permission"))){localStorage.removeItem("t");localStorage.removeItem("r");localStorage.removeItem("exp");throw Error("재생 권한을 새로 받아야 해. 페이지를 새로고침한 뒤 Spotify 로그인을 다시 눌러줘.");}throw Error("재생 시작 실패 ("+r.status+") "+x);}}
const CLIENT_ID="566e82bf871c4c60aceee473d9d1d83c";
const REDIRECT="https://yurethn.github.io/spotify/";
const AUTH_VERSION="2";
if(localStorage.authVersion!==AUTH_VERSION){localStorage.removeItem("t");localStorage.removeItem("r");localStorage.removeItem("exp");localStorage.authVersion=AUTH_VERSION;}
const A="https://accounts.spotify.com", API="https://api.spotify.com/v1";
function rnd(n=64){let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~",a=new Uint32Array(n),s="";crypto.getRandomValues(a);a.forEach(v=>s+=c[v%c.length]);return s}
async function hash(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s))}
function b64(b){return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
$("loginBtn").onclick=async()=>{let v=rnd(96),state=rnd(30);sessionStorage.v=v;sessionStorage.state=state;let ch=b64(await hash(v));location.href=A+"/authorize?"+new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT,scope:"streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state",code_challenge_method:"S256",code_challenge:ch,state})};
async function token(code){let r=await fetch(A+"/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:sessionStorage.v})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.error);localStorage.t=d.access_token;localStorage.exp=Date.now()+(d.expires_in-30)*1000;if(d.refresh_token)localStorage.r=d.refresh_token}
async function getToken(){if(localStorage.t&&Date.now()<+localStorage.exp)return localStorage.t;if(!localStorage.r)return null;let r=await fetch(A+"/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"refresh_token",refresh_token:localStorage.r})}),d=await r.json();if(!r.ok)return null;localStorage.t=d.access_token;localStorage.exp=Date.now()+(d.expires_in-30)*1000;return d.access_token}
async function api(p){let t=await getToken(),r=await fetch(API+p,{headers:{Authorization:"Bearer "+t}}),d=await r.json();if(!r.ok)throw Error(d.error?.message||"Spotify API error");return d}
const seeds=["a","e","i","o","u","b","c","d","f","g","h","j","k","l","m","n","p","r","s","t","w","y","가","나","다","라","마","사","아","愛","夜","the","love","blue","moon","1","2","3","7","9"];
async function randomTrack(){let st=$("status");st.textContent="랜덤 탐색 중…";try{let track=null;for(let tries=0;tries<8&&!track;tries++){let q=seeds[ri(seeds.length)],f=await api("/search?type=track&limit=10&q="+encodeURIComponent(q));let total=f.tracks?.total||0;if(!total)continue;let max=Math.min(Math.max(total-10,0),990),off=max?ri(Math.floor(max/10)+1)*10:0,d=off?await api("/search?type=track&limit=10&offset="+off+"&q="+encodeURIComponent(q)):f,items=d.tracks?.items||[];if(items.length)track=items[ri(items.length)]}if(!track)throw Error("곡을 못 찾았어. 다시 눌러줘.");const coverUrl=track.album?.images?.[0]?.url||"";$("cover").src=coverUrl;albumGlow($("cover"),coverUrl);$("name").textContent=track.name;$("artist").textContent=track.artists.map(x=>x.name).join(", ");$("open").href=track.external_urls.spotify;window.lastTrackUrl=track.external_urls.spotify;updateTimeline(0,track.duration_ms);loadLyrics(track);st.textContent="재생 시작 중…";await playHere(track.uri);st.textContent="▶ 사이트에서 재생 중"}catch(e){st.textContent=e.message}}
$("random").onclick=randomTrack;
$("playPause").onclick=async()=>{if(webPlayer)await webPlayer.togglePlay()};
$("prevRandom").onclick=()=>{ if(window.lastTrackUrl) window.open(window.lastTrackUrl,"_blank"); };
(async()=>{try{let p=new URLSearchParams(location.search),code=p.get("code");if(code){if(p.get("state")!==sessionStorage.state)throw Error("로그인 검증 실패");await token(code);history.replaceState({},"",REDIRECT)}if(await getToken()){$("login").classList.add("hide");$("player").classList.remove("hide");if(sdkReady)await initPlayer()}}catch(e){alert(e.message)}})();
</script></body></html>
