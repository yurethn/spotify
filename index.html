<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Random Spotify</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;padding:24px}.app{width:min(520px,100%);text-align:center}.cover{width:100%;aspect-ratio:1;border-radius:28px;object-fit:cover;background:#181818;box-shadow:0 20px 70px #000}.title{font-size:28px;font-weight:800;margin:22px 0 5px}.artist{color:#aaa;font-size:18px;margin-bottom:24px}.btn{width:100%;border:0;border-radius:999px;padding:18px;font-size:18px;font-weight:800;margin:7px 0;text-decoration:none;display:block}.green{background:#1ed760;color:#07150b}.dark{background:#222;color:#fff}.status{color:#888;font-size:14px;line-height:1.4;margin:16px}.logo{font-size:34px;font-weight:900;margin-bottom:24px}.hide{display:none}</style></head>
<body><main class="app"><div class="logo">RANDOM SPOTIFY</div>
<section id="login"><p>Spotify 전체 카탈로그를 무작위로 탐색합니다.<br>좋아요/플레이리스트는 사용하지 않습니다.</p><button class="btn green" id="loginBtn">Spotify 로그인</button></section>
<section id="player" class="hide"><img class="cover" id="cover"><div class="title" id="name">Ready</div><div class="artist" id="artist">—</div><button class="btn green" id="random">🎲 RANDOM</button><a class="btn dark" id="open" target="_blank">Spotify에서 열기</a><div class="status" id="status">버튼을 눌러 랜덤곡을 뽑아.</div></section></main>
<script>
const CLIENT_ID="566e82bf871c4c60aceee473d9d1d83c";
const REDIRECT="https://yurethn.github.io/spotify/";
const A="https://accounts.spotify.com", API="https://api.spotify.com/v1";
const $=x=>document.getElementById(x), ri=n=>Math.floor(Math.random()*n);
function rnd(n=64){let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~",a=new Uint32Array(n),s="";crypto.getRandomValues(a);a.forEach(v=>s+=c[v%c.length]);return s}
async function hash(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s))}
function b64(b){return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
$("loginBtn").onclick=async()=>{let v=rnd(96),state=rnd(30);sessionStorage.v=v;sessionStorage.state=state;let ch=b64(await hash(v));location.href=A+"/authorize?"+new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT,code_challenge_method:"S256",code_challenge:ch,state})};
async function token(code){let r=await fetch(A+"/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:sessionStorage.v})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.error);localStorage.t=d.access_token;localStorage.exp=Date.now()+(d.expires_in-30)*1000;if(d.refresh_token)localStorage.r=d.refresh_token}
async function getToken(){if(localStorage.t&&Date.now()<+localStorage.exp)return localStorage.t;if(!localStorage.r)return null;let r=await fetch(A+"/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"refresh_token",refresh_token:localStorage.r})}),d=await r.json();if(!r.ok)return null;localStorage.t=d.access_token;localStorage.exp=Date.now()+(d.expires_in-30)*1000;return d.access_token}
async function api(p){let t=await getToken(),r=await fetch(API+p,{headers:{Authorization:"Bearer "+t}}),d=await r.json();if(!r.ok)throw Error(d.error?.message||"Spotify API error");return d}
const seeds=["a","e","i","o","u","b","c","d","f","g","h","j","k","l","m","n","p","r","s","t","w","y","가","나","다","라","마","사","아","愛","夜","the","love","blue","moon","1","2","3","7","9"];
async function randomTrack(){let st=$("status");st.textContent="랜덤 탐색 중…";try{let track=null;for(let tries=0;tries<8&&!track;tries++){let q=seeds[ri(seeds.length)],f=await api("/search?type=track&limit=10&q="+encodeURIComponent(q));let total=f.tracks?.total||0;if(!total)continue;let max=Math.min(Math.max(total-10,0),990),off=max?ri(Math.floor(max/10)+1)*10:0,d=off?await api("/search?type=track&limit=10&offset="+off+"&q="+encodeURIComponent(q)):f,items=d.tracks?.items||[];if(items.length)track=items[ri(items.length)]}if(!track)throw Error("곡을 못 찾았어. 다시 눌러줘.");$("cover").src=track.album?.images?.[0]?.url||"";$("name").textContent=track.name;$("artist").textContent=track.artists.map(x=>x.name).join(", ");$("open").href=track.external_urls.spotify;st.textContent="선택 완료"}catch(e){st.textContent=e.message}}
$("random").onclick=randomTrack;
(async()=>{try{let p=new URLSearchParams(location.search),code=p.get("code");if(code){if(p.get("state")!==sessionStorage.state)throw Error("로그인 검증 실패");await token(code);history.replaceState({},"",REDIRECT)}if(await getToken()){$("login").classList.add("hide");$("player").classList.remove("hide")}}catch(e){alert(e.message)}})();
</script></body></html>
