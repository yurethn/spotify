<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Random Spotify</title>
<style>
*{box-sizing:border-box}
:root{--bg:#090909;--panel:#121212;--panel2:#181818;--muted:#a7a7a7;--green:#1ed760;--white:#fff}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;background:
radial-gradient(1200px 700px at 50% -120px,rgba(30,215,96,.18),transparent 55%),
linear-gradient(180deg,#111 0%,#090909 45%,#050505 100%);padding:22px}
.app{width:min(620px,100%);margin:0 auto;padding-bottom:40px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding:0 4px}
.brand{font-weight:800;letter-spacing:-.4px;font-size:18px}
.badge{font-size:11px;color:#8a8a8a;background:transparent;border:0;padding:0}
.card{background:transparent;border:0;border-radius:0;padding:0;box-shadow:none;backdrop-filter:none}
.coverWrap{position:relative;isolation:isolate}.coverGlow{position:absolute;inset:8%;z-index:-1;filter:blur(56px) saturate(1.45);opacity:.5;border-radius:40px;transform:scale(1.14);background-size:cover;background-position:center;transition:background-image .35s ease,opacity .35s ease}
.cover{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;background:#181818;box-shadow:0 22px 54px rgba(0,0,0,.5)}
.nowpill{display:none}
.title{font-size:28px;line-height:1.08;font-weight:800;letter-spacing:-.7px;margin:22px 0 6px;text-align:left}
.artist{color:#b3b3b3;font-size:16px;text-align:left;margin-bottom:20px}
.timeline{margin:8px 0 14px}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:linear-gradient(to right,var(--green) 0%,var(--green) var(--seek-pct,0%),#3a3a3a var(--seek-pct,0%),#3a3a3a 100%);border:0;border-radius:999px;outline:0;touch-action:none}
.seek::-webkit-slider-runnable-track{height:6px;background:transparent;border:0}
.seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--green);border:0;box-shadow:none;opacity:0;transition:opacity .12s}
.seek.dragging::-webkit-slider-thumb{opacity:1}
.seek::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--green);border:0;opacity:0}
.seek.dragging::-moz-range-thumb{opacity:1}
.times{display:flex;justify-content:space-between;color:#929292;font-size:12px;margin-top:4px}
.controls{display:flex;align-items:center;justify-content:center;gap:20px;margin:10px 0 18px}
.iconBtn{border:0;background:#fff;color:#000;border-radius:999px;width:56px;height:56px;font-size:23px;font-weight:900;display:grid;place-items:center}
.randomBtn{border:0;background:transparent;color:#fff;border-radius:999px;padding:14px 18px;font-size:15px;font-weight:800}
.openBtn{display:block;text-decoration:none;text-align:center;background:transparent;color:#b3b3b3;border-radius:0;padding:8px 0;font-weight:700;margin-top:2px;font-size:13px}
.status{color:#8c8c8c;font-size:13px;line-height:1.5;margin:14px 2px 0}
.lyricsCard{margin-top:18px;background:transparent;border:0;border-radius:0;padding:0;max-height:none;overflow:hidden;text-align:left;cursor:pointer}
.lyricsViewport{position:relative;height:156px;overflow:hidden;mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%)}
.lyricsTrack{transition:transform .35s ease}
.lyricsCard.expanded .lyricsViewport{height:auto;max-height:56vh;overflow:auto;mask-image:none;-webkit-mask-image:none}
.lyricsCard.expanded .lyricsTrack{transform:none!important}
.lyricsHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lyricsHead h2{font-size:18px;margin:0;font-weight:800}
.lyricsHint{font-size:12px;color:#777}
.lyricLine{display:block;width:100%;appearance:none;border:0;background:transparent;padding:0;text-align:center;font-size:24px;line-height:1.28;font-weight:800;color:#6f6f6f;margin:16px 0;transition:.22s ease;cursor:pointer}
.lyricLine.active{color:#fff;transform:scale(1.04);transform-origin:center center}
.lyricLine.past{color:#8a8a8a}
.plainLyrics{white-space:pre-wrap;font-size:18px;line-height:1.75;color:#ddd}
.loginBox{text-align:center;padding:34px 16px}
.loginBox p{color:#aaa;line-height:1.55}
.loginBtn{width:100%;border:0;background:var(--green);color:#07130b;border-radius:999px;padding:17px;font-size:17px;font-weight:900}
.hide{display:none!important}
@media (min-width:800px){.card{padding:26px}.cover{border-radius:26px}}
</style></head>
<body><main class="app">
<div class="topbar"><div class="brand">Random Spotify</div><div class="badge">v11 · centered lyrics</div></div>
<div class="card">
<section id="login" class="loginBox">
<p>Spotify 카탈로그를 무작위로 탐색하고 이 페이지 안에서 재생합니다.</p>
<button class="loginBtn" id="loginBtn">Spotify 로그인</button>
</section>
<section id="player" class="hide">
<div class="coverWrap"><div class="coverGlow" id="coverGlow"></div><img class="cover" id="cover" crossorigin="anonymous"><div class="nowpill">NOW PLAYING</div></div>
<div class="title" id="name">Ready</div>
<div class="artist" id="artist">—</div>
<div class="timeline"><input class="seek" id="seek" type="range" min="0" max="1000" value="0"><div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div></div>
<div class="controls">
<button class="randomBtn" id="random">🎲 RANDOM</button>
<button class="iconBtn" id="playPause" aria-label="play pause">⏯</button>
</div>
<a class="openBtn" id="open" target="_blank">Spotify에서 열기</a>
<div class="status" id="status">버튼을 눌러 랜덤곡을 뽑아.</div>
<div class="lyricsCard hide" id="lyricsCard">
<div class="lyricsHead"><h2>Lyrics</h2><div class="lyricsHint" id="lyricsHint">눌러서 전체 보기</div></div>
<div class="lyricsViewport" id="lyricsViewport"><div class="lyricsTrack" id="lyrics"></div></div>
</div>
</section>
</div>
</main>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>

const CLIENT_ID = '566e82bf871c4c60aceee473d9d1d83c';
const REDIRECT = 'https://yurethn.github.io/spotify/';
const AUTH_VERSION = '3';
const ACCOUNTS = 'https://accounts.spotify.com';
const API = 'https://api.spotify.com/v1';
const $ = id => document.getElementById(id);
const rand = n => Math.floor(Math.random() * n);

let player = null;
let deviceId = null;
let sdkReady = false;
let isScrubbing = false;
let currentDuration = 0;
let syncedLines = [];
let activeLyricIndex = -1;

const seeds = ['a','e','i','o','u','b','c','d','f','g','h','j','k','l','m','n','p','r','s','t','w','y','가','나','다','라','마','사','아','愛','夜','the','love','blue','moon','1','2','3','7','9'];

function fmt(ms = 0) {
  const total = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
}
function setStatus(text) { $('status').textContent = text; }
function randomString(length = 64) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const arr = new Uint32Array(length);
  crypto.getRandomValues(arr);
  return Array.from(arr, v => chars[v % chars.length]).join('');
}
async function sha256(text) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
}
function base64url(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}

async function beginLogin() {
  const verifier = randomString(96);
  const state = randomString(32);
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('oauth_state', state);
  const challenge = base64url(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT,
    scope: 'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state',
    code_challenge_method: 'S256',
    code_challenge: challenge,
    state
  });
  location.href = ACCOUNTS + '/authorize?' + params;
}

function storeTokens(data) {
  localStorage.setItem('access_token', data.access_token);
  localStorage.setItem('expires_at', String(Date.now() + (data.expires_in - 45) * 1000));
  if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
}
async function exchangeCode(code) {
  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier) throw new Error('로그인 세션이 만료됐어. 다시 로그인해줘.');
  const res = await fetch(ACCOUNTS + '/api/token', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'authorization_code',
      code,
      redirect_uri: REDIRECT,
      code_verifier: verifier
    })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.error || '토큰 발급 실패');
  storeTokens(data);
}
async function getToken() {
  const token = localStorage.getItem('access_token');
  const expires = Number(localStorage.getItem('expires_at') || 0);
  if (token && Date.now() < expires) return token;
  const refresh = localStorage.getItem('refresh_token');
  if (!refresh) return null;
  const res = await fetch(ACCOUNTS + '/api/token', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({client_id: CLIENT_ID, grant_type: 'refresh_token', refresh_token: refresh})
  });
  const data = await res.json();
  if (!res.ok) return null;
  storeTokens({...data, refresh_token: data.refresh_token || refresh});
  return data.access_token;
}
async function api(path, options = {}) {
  const token = await getToken();
  if (!token) throw new Error('Spotify 로그인이 필요해.');
  const res = await fetch(API + path, {
    ...options,
    headers: {Authorization: 'Bearer ' + token, ...(options.headers || {})}
  });
  if (res.status === 204) return null;
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) {}
  if (!res.ok) throw new Error(data?.error?.message || ('Spotify API 오류 ' + res.status));
  return data;
}

window.onSpotifyWebPlaybackSDKReady = async () => {
  sdkReady = true;
  if (await getToken()) initPlayer();
};

async function initPlayer() {
  if (player || !sdkReady || !window.Spotify) return;
  player = new Spotify.Player({
    name: 'Random Spotify iPad',
    getOAuthToken: async cb => cb(await getToken()),
    volume: 0.8,
    enableMediaSession: true
  });
  player.addListener('ready', ({device_id}) => {
    deviceId = device_id;
    setStatus('웹 플레이어 준비 완료');
  });
  player.addListener('not_ready', () => {
    deviceId = null;
    setStatus('플레이어 연결이 끊겼어.');
  });
  player.addListener('account_error', () => setStatus('웹 재생에는 Spotify Premium이 필요해.'));
  player.addListener('authentication_error', ({message}) => setStatus('인증 오류: ' + message));
  player.addListener('playback_error', ({message}) => setStatus('재생 오류: ' + message));
  player.addListener('autoplay_failed', () => setStatus('RANDOM 버튼을 한 번 더 눌러 재생을 활성화해줘.'));
  player.addListener('player_state_changed', state => {
    if (!state) return;
    currentDuration = state.duration || currentDuration;
    if (!isScrubbing) updateTimeline(state.position || 0, currentDuration);
  });
  await player.connect();
}

function updateTimeline(position, duration) {
  currentDuration = duration || currentDuration;
  $('pos').textContent = fmt(position);
  $('dur').textContent = fmt(currentDuration);
  const pct = currentDuration ? Math.max(0, Math.min(1000, Math.round(position / currentDuration * 1000))) : 0;
  $('seek').value = pct;
  $('seek').style.setProperty('--seek-pct', (pct / 10) + '%');
  updateLiveLyrics(position);
}

async function seekTo(ms) {
  const target = Math.max(0, Math.min(Math.round(ms), Math.max(0, currentDuration - 250)));
  let ok = false;
  if (player) {
    try {
      await player.seek(target);
      ok = true;
    } catch (_) {}
  }
  if (!ok && deviceId) {
    try {
      await api('/me/player/seek?position_ms=' + target + '&device_id=' + encodeURIComponent(deviceId), {method: 'PUT'});
      ok = true;
    } catch (_) {}
  }
  if (!ok) throw new Error('재생 위치를 이동하지 못했어.');
  updateTimeline(target, currentDuration);
}

function bindSeekBar() {
  const seek = $('seek');
  const start = () => {
    isScrubbing = true;
    seek.classList.add('dragging');
  };
  const preview = () => {
    const target = currentDuration * (Number(seek.value) / 1000);
    $('pos').textContent = fmt(target);
    seek.style.setProperty('--seek-pct', (Number(seek.value) / 10) + '%');
  };
  const finish = async () => {
    if (!isScrubbing) return;
    const target = currentDuration * (Number(seek.value) / 1000);
    isScrubbing = false;
    seek.classList.remove('dragging');
    try { await seekTo(target); } catch (e) { setStatus(e.message); }
  };
  seek.addEventListener('pointerdown', start);
  seek.addEventListener('touchstart', start, {passive: true});
  seek.addEventListener('input', preview);
  seek.addEventListener('change', finish);
  seek.addEventListener('pointerup', finish);
  seek.addEventListener('touchend', finish);
}

function parseLRC(text) {
  const lines = [];
  for (const raw of String(text || '').split(/\r?\n/)) {
    const m = raw.match(/^\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]\s*(.*)$/);
    if (!m || !m[4].trim()) continue;
    const frac = m[3] ? Number(m[3].padEnd(3, '0').slice(0, 3)) : 0;
    lines.push({
      ms: (Number(m[1]) * 60 + Number(m[2])) * 1000 + frac,
      text: m[4].trim()
    });
  }
  return lines.sort((a, b) => a.ms - b.ms);
}

function renderSyncedLyrics(lines) {
  syncedLines = lines;
  activeLyricIndex = -1;
  const box = $('lyrics');
  box.innerHTML = '';
  box.style.transform = 'translateY(0)';
  lines.forEach(line => {
    const div = document.createElement('button');
    div.type = 'button';
    div.className = 'lyricLine';
    div.textContent = line.text;
    div.addEventListener('click', async () => {
      try { await seekTo(line.ms); } catch (e) { setStatus(e.message); }
    });
    box.appendChild(div);
  });
}

function updateLiveLyrics(position) {
  if (!syncedLines.length) return;
  let idx = -1;
  for (let i = 0; i < syncedLines.length; i++) {
    if (position >= syncedLines[i].ms) idx = i;
    else break;
  }
  if (idx === activeLyricIndex) return;
  activeLyricIndex = idx;
  const lines = [...$('lyrics').querySelectorAll('.lyricLine')];
  lines.forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('past', i < idx);
  });
  const active = lines[idx];
  if (active) {
    const card = $('lyricsCard');
    if (card.classList.contains('expanded')) {
      const viewport = $('lyricsViewport');
      const target = active.offsetTop - viewport.clientHeight / 2 + active.clientHeight / 2;
      viewport.scrollTo({top: Math.max(0, target), behavior: 'smooth'});
    } else {
      const track = $('lyrics');
      const viewport = $('lyricsViewport');
      const target = active.offsetTop - viewport.clientHeight / 2 + active.clientHeight / 2;
      track.style.transform = 'translateY(' + (-Math.max(0, target)) + 'px)';
    }
  }
}

function normalizeTitle(s) {
  return String(s || '')
    .replace(/\s*[-–—]\s*(remaster(ed)?|live|radio edit|edit|version).*$/i, '')
    .replace(/\s*\((remaster(ed)?|live|radio edit|edit|version)[^)]*\)\s*$/i, '')
    .trim();
}

function scoreLyricsCandidate(item, title, artist, durationSec) {
  let score = 0;
  const itemTitle = String(item.trackName || '').toLowerCase();
  const itemArtist = String(item.artistName || '').toLowerCase();
  if (itemTitle === title.toLowerCase()) score += 7;
  else if (itemTitle.includes(title.toLowerCase())) score += 4;
  if (itemArtist.includes(artist.toLowerCase())) score += 5;
  if (item.syncedLyrics) score += 4;
  if (item.duration && durationSec) {
    const delta = Math.abs(Number(item.duration) - durationSec);
    score += Math.max(0, 3 - delta / 4);
  }
  return score;
}

async function fetchLyrics(track) {
  const card = $('lyricsCard');
  const box = $('lyrics');
  const hint = $('lyricsHint');
  card.classList.add('hide');
  box.innerHTML = '';
  hint.textContent = '';
  syncedLines = [];
  activeLyricIndex = -1;

  const artist = track.artists?.[0]?.name || '';
  const title = normalizeTitle(track.name);
  const duration = Math.round(track.duration_ms / 1000);
  const all = [];
  const urls = [
    'https://lrclib.net/api/get?' + new URLSearchParams({
      track_name: title,
      artist_name: artist,
      album_name: track.album?.name || '',
      duration
    }),
    'https://lrclib.net/api/search?' + new URLSearchParams({
      track_name: title,
      artist_name: artist
    }),
    'https://lrclib.net/api/search?' + new URLSearchParams({
      q: title + ' ' + artist
    })
  ];

  for (const url of urls) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const data = await res.json();
      if (Array.isArray(data)) all.push(...data);
      else if (data) all.push(data);
    } catch (_) {}
  }

  if (!all.length) return;
  all.sort((a, b) => scoreLyricsCandidate(b, title, artist, duration) - scoreLyricsCandidate(a, title, artist, duration));
  const best = all[0];

  if (best?.syncedLyrics) {
    const lines = parseLRC(best.syncedLyrics);
    if (lines.length) {
      renderSyncedLyrics(lines);
      hint.textContent = '실시간';
      card.classList.remove('hide');
      return;
    }
  }

  if (best?.plainLyrics?.trim()) {
    const pre = document.createElement('div');
    pre.className = 'plainLyrics';
    pre.textContent = best.plainLyrics.trim();
    box.appendChild(pre);
    hint.textContent = '가사';
    card.classList.remove('hide');
  }
}

function setCover(track) {
  const url = track.album?.images?.[0]?.url || '';
  $('cover').src = url;
  $('coverGlow').style.backgroundImage = url ? 'url("' + url + '")' : 'none';
}

async function playTrack(track) {
  if (!player) await initPlayer();
  if (!player || !deviceId) throw new Error('웹 플레이어가 아직 준비되지 않았어. RANDOM을 한 번 더 눌러줘.');
  await player.activateElement();
  await api('/me/player/play?device_id=' + encodeURIComponent(deviceId), {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({uris: [track.uri]})
  });
}

async function randomTrack() {
  setStatus('랜덤 탐색 중…');
  $('random').disabled = true;

  try {
    let track = null;

    for (let attempt = 0; attempt < 8 && !track; attempt++) {
      const q = seeds[rand(seeds.length)];
      const first = await api('/search?type=track&limit=10&offset=0&q=' + encodeURIComponent(q));
      const total = first?.tracks?.total || 0;
      if (!total) continue;

      const maxOffset = Math.min(Math.max(total - 10, 0), 990);
      const offset = maxOffset ? rand(Math.floor(maxOffset / 10) + 1) * 10 : 0;
      const page = offset === 0
        ? first
        : await api('/search?type=track&limit=10&offset=' + offset + '&q=' + encodeURIComponent(q));

      const items = (page?.tracks?.items || []).filter(t => t?.uri && t?.is_playable !== false);
      if (items.length) track = items[rand(items.length)];
    }

    if (!track) throw new Error('랜덤 곡을 찾지 못했어. 다시 눌러줘.');

    setCover(track);
    $('name').textContent = track.name;
    $('artist').textContent = track.artists.map(a => a.name).join(', ');
    $('open').href = track.external_urls.spotify;
    currentDuration = track.duration_ms || 0;
    updateTimeline(0, currentDuration);
    fetchLyrics(track);

    setStatus('재생 시작 중…');
    await playTrack(track);
    setStatus('▶ 사이트에서 재생 중');
  } catch (e) {
    setStatus(e.message || String(e));
  } finally {
    $('random').disabled = false;
  }
}

async function init() {
  if (localStorage.getItem('auth_version') !== AUTH_VERSION) {
    ['access_token','refresh_token','expires_at','t','r','exp'].forEach(k => localStorage.removeItem(k));
    localStorage.setItem('auth_version', AUTH_VERSION);
  }

  $('loginBtn').addEventListener('click', beginLogin);
  $('random').addEventListener('click', randomTrack);
  $('playPause').addEventListener('click', async () => {
    if (player) await player.togglePlay();
  });
  bindSeekBar();
  $('lyricsCard').addEventListener('click', e => {
    if (e.target.classList.contains('lyricLine')) return;
    const card = $('lyricsCard');
    card.classList.toggle('expanded');
    $('lyricsHint').textContent = card.classList.contains('expanded') ? '눌러서 접기' : '눌러서 전체 보기';
  });

  const params = new URLSearchParams(location.search);
  if (params.get('error')) throw new Error('Spotify 로그인 오류: ' + params.get('error'));

  const code = params.get('code');
  if (code) {
    if (params.get('state') !== sessionStorage.getItem('oauth_state')) throw new Error('로그인 검증 실패');
    await exchangeCode(code);
    history.replaceState({}, '', REDIRECT);
  }

  if (await getToken()) {
    $('login').classList.add('hide');
    $('player').classList.remove('hide');
    if (sdkReady) await initPlayer();
  }
}

setInterval(async () => {
  if (!player || isScrubbing) return;
  try {
    const state = await player.getCurrentState();
    if (state) updateTimeline(state.position || 0, state.duration || currentDuration);
  } catch (_) {}
}, 500);

init().catch(e => {
  console.error(e);
  alert(e.message || String(e));
});

</script></body></html>
