<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Random Spotify</title>
<style>
*{box-sizing:border-box}
:root{--green:#1ed760;--fg:#fff;--muted:#b3b3b3;--dim:#737373}
html,body{margin:0;min-height:100%;background:#000;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;background:linear-gradient(180deg,#242424 0,#121212 42%,#000 100%);padding:max(16px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
button,a,input{font:inherit}
button{cursor:pointer}
.app{width:min(560px,100%);margin:0 auto}
.topbar{display:none}
.card{background:transparent}
.playerHead{height:48px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;margin-bottom:22px}
.headMeta{text-align:center;min-width:0;text-transform:uppercase}.headMeta span{display:block;font-size:10px;letter-spacing:1.1px;font-weight:700;color:#ddd}.headMeta strong{display:block;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ghostIcon{width:42px;height:42px;border:0;background:transparent;color:#fff;padding:9px}.ghostIcon svg{width:24px;height:24px}
.coverWrap{position:relative;isolation:isolate;margin:0 auto;width:100%;aspect-ratio:1;background:#181818;border-radius:7px;overflow:visible}.coverGlow{position:absolute;inset:12% 7% -5%;z-index:-1;filter:blur(65px) saturate(1.35);opacity:.32;background-size:cover;background-position:center;transform:scale(1.05)}
.cover{display:block;width:100%;height:100%;object-fit:cover;border-radius:7px;background:#181818;box-shadow:0 18px 55px rgba(0,0,0,.5);opacity:0;transition:opacity .22s ease}.cover.loaded{opacity:1}
.trackRow{display:flex;align-items:center;gap:16px;margin:24px 2px 17px}.trackText{min-width:0;flex:1}.title{font-size:23px;line-height:1.15;font-weight:750;letter-spacing:-.45px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:15px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saveIcon{flex:0 0 38px;width:38px;height:38px;border:0;background:transparent;color:var(--muted);padding:7px}.saveIcon svg{width:25px;height:25px}
.timeline{margin:0 2px 5px}.seek{-webkit-appearance:none;appearance:none;width:100%;height:4px;margin:0;display:block;border:0;border-radius:999px;outline:0;background:linear-gradient(to right,#fff 0,#fff var(--seek-pct,0%),rgba(255,255,255,.28) var(--seek-pct,0%),rgba(255,255,255,.28) 100%);touch-action:none}
.seek::-webkit-slider-runnable-track{height:4px;background:transparent;border:0}.seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:0;opacity:0}.seek.dragging::-webkit-slider-thumb{opacity:1}
.times{display:flex;justify-content:space-between;color:#aaa;font-size:11px;margin-top:7px}
.transport{display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;justify-items:center;margin:12px 0 14px}
.transportIcon{width:46px;height:46px;border:0;background:transparent;color:#d7d7d7;padding:10px}.transportIcon svg{width:26px;height:26px}.transportIcon.activeGreen{color:var(--green)}
.playMain{width:64px;height:64px;border-radius:50%;border:0;background:#fff;color:#000;display:grid;place-items:center;padding:18px}.playMain svg{width:28px;height:28px;fill:currentColor;stroke:none}
.secondaryRow{display:flex;align-items:center;justify-content:space-between;min-height:34px;margin:0 3px 14px}.deviceLink{display:flex;align-items:center;gap:7px;color:var(--green);text-decoration:none;font-size:12px;font-weight:700}.deviceLink svg{width:17px;height:17px}.status{font-size:11px;color:#777;text-align:right;max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyricsCard{margin-top:10px;background:transparent;border:0;padding:0;overflow:hidden;cursor:pointer}.lyricsHead{display:flex;align-items:center;justify-content:space-between;margin:0 1px 8px}.lyricsHead h2{margin:0;font-size:17px;font-weight:750}.lyricsHint{font-size:11px;color:#8e8e8e}
.lyricsViewport{position:relative;height:162px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent)}
.lyricsTrack{transition:transform .32s cubic-bezier(.22,.61,.36,1)}.lyricsCard.expanded .lyricsViewport{height:auto;max-height:60vh;overflow:auto;-webkit-mask-image:none;mask-image:none}.lyricsCard.expanded .lyricsTrack{transform:none!important}
.lyricLine{display:block;width:100%;border:0;background:transparent;color:#737373;padding:0;text-align:center;font-size:25px;line-height:1.25;font-weight:750;letter-spacing:-.35px;margin:17px 0;transition:color .18s,transform .18s}.lyricLine.active{color:#fff;transform:scale(1.035)}.lyricLine.past{color:#919191}.plainLyrics{white-space:pre-wrap;color:#ddd;font-size:18px;line-height:1.65;text-align:left}
.loginBox{text-align:center;padding:20vh 12px}.loginBox p{color:#b3b3b3;line-height:1.5}.loginBtn{width:100%;border:0;border-radius:999px;background:var(--green);color:#000;padding:16px 22px;font-weight:800;font-size:16px}.hide{display:none!important}
@media(min-width:700px){.coverWrap{width:92%}.trackRow,.timeline,.transport,.secondaryRow,.lyricsCard{width:92%;margin-left:auto;margin-right:auto}}
</style></head>
<body><main class="app">
<div class="topbar"><div class="brand">Random Spotify</div><div class="badge">v14 · autoplay next</div></div>
<div class="card">
<section id="login" class="loginBox">
<p>Spotify 카탈로그를 무작위로 탐색하고 이 페이지 안에서 재생합니다.</p>
<button class="loginBtn" id="loginBtn">Spotify 로그인</button>
</section>
<section id="player" class="hide">
<div class="playerHead">
<button class="ghostIcon" id="collapseBtn" aria-label="collapse"><svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg></button>
<div class="headMeta"><span>PLAYING FROM RANDOM</span><strong id="headAlbum">DISCOVERY</strong></div>
<button class="ghostIcon" id="moreBtn" aria-label="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
</div>
<div class="coverWrap"><div class="coverGlow" id="coverGlow"></div><img class="cover" id="cover"></div>
<div class="trackRow">
<div class="trackText"><div class="title" id="name">Choose a random track</div><div class="artist" id="artist">Random Spotify</div></div>
<button class="saveIcon" id="saveVisual" aria-label="save"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button>
</div>
<div class="timeline"><input class="seek" id="seek" type="range" min="0" max="1000" value="0"><div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div></div>
<div class="transport">
<button class="transportIcon activeGreen" id="random" aria-label="random track"><svg viewBox="0 0 24 24"><path d="M4 7h3c5 0 5 10 10 10h3"/><path d="m17 14 3 3-3 3"/><path d="M4 17h3c2.1 0 3.3-1.8 4.4-3.8"/><path d="M14 8.8C15 7.7 15.8 7 17 7h3"/><path d="m17 4 3 3-3 3"/></svg></button>
<button class="transportIcon" id="back15" aria-label="back"><svg viewBox="0 0 24 24"><path d="M6 6v12"/><path d="m18 6-9 6 9 6z"/></svg></button>
<button class="playMain" id="playPause" aria-label="play pause"><svg id="playPauseIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
<button class="transportIcon" id="nextRandom" aria-label="next random"><svg viewBox="0 0 24 24"><path d="M18 6v12"/><path d="m6 6 9 6-9 6z"/></svg></button>
<button class="transportIcon" id="repeatVisual" aria-label="repeat"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
</div>
<div class="secondaryRow">
<a class="deviceLink" id="open" target="_blank"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 10c3-1 6-.7 9 .8M8.7 13c2.5-.7 4.8-.4 7 .6M9.5 16c1.8-.4 3.5-.2 5 .4"/></svg><span>Spotify</span></a>
<span class="status" id="status">Ready</span>
</div>
<div class="lyricsCard hide" id="lyricsCard">
<div class="lyricsHead"><h2>Lyrics</h2><div class="lyricsHint" id="lyricsHint">전체 보기</div></div>
<div class="lyricsViewport" id="lyricsViewport"><div class="lyricsTrack" id="lyrics"></div></div>
</div>
</section>
</div>
</main>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>

const CLIENT_ID = '566e82bf871c4c60aceee473d9d1d83c';
const REDIRECT = 'https://yurethn.github.io/spotify/';
const AUTH_VERSION = '3';
const ACCOUNTS = 'https://accounts.spotify.com';
const API = 'https://api.spotify.com/v1';
const $ = id => document.getElementById(id);
const rand = n => Math.floor(Math.random() * n);

let player = null;
let deviceId = null;
let sdkReady = false;
let isScrubbing = false;
let currentDuration = 0;
let syncedLines = [];
let activeLyricIndex = -1;
let currentTrack = null;
let autoAdvancing = false;
let lastPlaybackPosition = 0;

const seeds = ['a','e','i','o','u','b','c','d','f','g','h','j','k','l','m','n','p','r','s','t','w','y','가','나','다','라','마','사','아','愛','夜','the','love','blue','moon','1','2','3','7','9'];

function fmt(ms = 0) {
  const total = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
}
function setStatus(text) { $('status').textContent = text; }
function randomString(length = 64) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const arr = new Uint32Array(length);
  crypto.getRandomValues(arr);
  return Array.from(arr, v => chars[v % chars.length]).join('');
}
async function sha256(text) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
}
function base64url(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}

async function beginLogin() {
  const verifier = randomString(96);
  const state = randomString(32);
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('oauth_state', state);
  const challenge = base64url(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT,
    scope: 'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state',
    code_challenge_method: 'S256',
    code_challenge: challenge,
    state
  });
  location.href = ACCOUNTS + '/authorize?' + params;
}

function storeTokens(data) {
  localStorage.setItem('access_token', data.access_token);
  localStorage.setItem('expires_at', String(Date.now() + (data.expires_in - 45) * 1000));
  if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
}
async function exchangeCode(code) {
  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier) throw new Error('로그인 세션이 만료됐어. 다시 로그인해줘.');
  const res = await fetch(ACCOUNTS + '/api/token', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'authorization_code',
      code,
      redirect_uri: REDIRECT,
      code_verifier: verifier
    })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.error || '토큰 발급 실패');
  storeTokens(data);
}
async function getToken() {
  const token = localStorage.getItem('access_token');
  const expires = Number(localStorage.getItem('expires_at') || 0);
  if (token && Date.now() < expires) return token;
  const refresh = localStorage.getItem('refresh_token');
  if (!refresh) return null;
  const res = await fetch(ACCOUNTS + '/api/token', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({client_id: CLIENT_ID, grant_type: 'refresh_token', refresh_token: refresh})
  });
  const data = await res.json();
  if (!res.ok) return null;
  storeTokens({...data, refresh_token: data.refresh_token || refresh});
  return data.access_token;
}
async function api(path, options = {}) {
  const token = await getToken();
  if (!token) throw new Error('Spotify 로그인이 필요해.');
  const res = await fetch(API + path, {
    ...options,
    headers: {Authorization: 'Bearer ' + token, ...(options.headers || {})}
  });
  if (res.status === 204) return null;
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) {}
  if (!res.ok) throw new Error(data?.error?.message || ('Spotify API 오류 ' + res.status));
  return data;
}

window.onSpotifyWebPlaybackSDKReady = async () => {
  sdkReady = true;
  if (await getToken()) initPlayer();
};

async function initPlayer() {
  if (player || !sdkReady || !window.Spotify) return;
  player = new Spotify.Player({
    name: 'Random Spotify iPad',
    getOAuthToken: async cb => cb(await getToken()),
    volume: 0.8,
    enableMediaSession: true
  });
  player.addListener('ready', ({device_id}) => {
    deviceId = device_id;
    setStatus('Ready');
  });
  player.addListener('not_ready', () => {
    deviceId = null;
    setStatus('플레이어 연결이 끊겼어.');
  });
  player.addListener('account_error', () => setStatus('웹 재생에는 Spotify Premium이 필요해.'));
  player.addListener('authentication_error', ({message}) => setStatus('인증 오류: ' + message));
  player.addListener('playback_error', ({message}) => setStatus('재생 오류: ' + message));
  player.addListener('autoplay_failed', () => setStatus('RANDOM 버튼을 한 번 더 눌러 재생을 활성화해줘.'));
  player.addListener('player_state_changed', state => {
    if (!state) return;
    currentDuration = state.duration || currentDuration;
    const position = state.position || 0;
    if (!isScrubbing) updateTimeline(position, currentDuration);
    $('playPauseIcon').innerHTML = !state.paused ? '<path d="M7 5h4v14H7zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    const naturallyEnded = currentTrack && state.paused && position === 0 && currentDuration > 0 && lastPlaybackPosition > Math.max(3000, currentDuration - 3000);
    if (naturallyEnded && !autoAdvancing) {
      autoAdvancing = true;
      setTimeout(async () => {
        try { await randomTrack(); }
        finally { autoAdvancing = false; }
      }, 250);
    }
    if (position > 0) lastPlaybackPosition = position;
  });
  await player.connect();
}

function updateTimeline(position, duration) {
  currentDuration = duration || currentDuration;
  $('pos').textContent = fmt(position);
  $('dur').textContent = fmt(currentDuration);
  const pct = currentDuration ? Math.max(0, Math.min(1000, Math.round(position / currentDuration * 1000))) : 0;
  $('seek').value = pct;
  $('seek').style.setProperty('--seek-pct', (pct / 10) + '%');
  updateLiveLyrics(position);
}

async function seekTo(ms) {
  const target = Math.max(0, Math.min(Math.round(ms), Math.max(0, currentDuration - 250)));
  let ok = false;
  if (player) {
    try {
      await player.seek(target);
      ok = true;
    } catch (_) {}
  }
  if (!ok && deviceId) {
    try {
      await api('/me/player/seek?position_ms=' + target + '&device_id=' + encodeURIComponent(deviceId), {method: 'PUT'});
      ok = true;
    } catch (_) {}
  }
  if (!ok) throw new Error('재생 위치를 이동하지 못했어.');
  updateTimeline(target, currentDuration);
}

function bindSeekBar() {
  const seek = $('seek');
  const start = () => {
    isScrubbing = true;
    seek.classList.add('dragging');
  };
  const preview = () => {
    const target = currentDuration * (Number(seek.value) / 1000);
    $('pos').textContent = fmt(target);
    seek.style.setProperty('--seek-pct', (Number(seek.value) / 10) + '%');
  };
  const finish = async () => {
    if (!isScrubbing) return;
    const target = currentDuration * (Number(seek.value) / 1000);
    isScrubbing = false;
    seek.classList.remove('dragging');
    try { await seekTo(target); } catch (e) { setStatus(e.message); }
  };
  seek.addEventListener('pointerdown', start);
  seek.addEventListener('touchstart', start, {passive: true});
  seek.addEventListener('input', preview);
  seek.addEventListener('change', finish);
  seek.addEventListener('pointerup', finish);
  seek.addEventListener('touchend', finish);
}

function parseLRC(text) {
  const lines = [];
  for (const raw of String(text || '').split(/\r?\n/)) {
    const m = raw.match(/^\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]\s*(.*)$/);
    if (!m || !m[4].trim()) continue;
    const frac = m[3] ? Number(m[3].padEnd(3, '0').slice(0, 3)) : 0;
    lines.push({
      ms: (Number(m[1]) * 60 + Number(m[2])) * 1000 + frac,
      text: m[4].trim()
    });
  }
  return lines.sort((a, b) => a.ms - b.ms);
}

function renderSyncedLyrics(lines) {
  syncedLines = lines;
  activeLyricIndex = -1;
  const box = $('lyrics');
  box.innerHTML = '';
  box.style.transform = 'translateY(0)';
  lines.forEach(line => {
    const div = document.createElement('button');
    div.type = 'button';
    div.className = 'lyricLine';
    div.textContent = line.text;
    div.addEventListener('click', async () => {
      try { await seekTo(line.ms); } catch (e) { setStatus(e.message); }
    });
    box.appendChild(div);
  });
}

function updateLiveLyrics(position) {
  if (!syncedLines.length) return;
  let idx = -1;
  for (let i = 0; i < syncedLines.length; i++) {
    if (position >= syncedLines[i].ms) idx = i;
    else break;
  }
  if (idx === activeLyricIndex) return;
  activeLyricIndex = idx;
  const lines = [...$('lyrics').querySelectorAll('.lyricLine')];
  lines.forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('past', i < idx);
  });
  const active = lines[idx];
  if (active) {
    const card = $('lyricsCard');
    if (card.classList.contains('expanded')) {
      const viewport = $('lyricsViewport');
      const target = active.offsetTop - viewport.clientHeight / 2 + active.clientHeight / 2;
      viewport.scrollTo({top: Math.max(0, target), behavior: 'smooth'});
    } else {
      const track = $('lyrics');
      const viewport = $('lyricsViewport');
      const target = active.offsetTop - viewport.clientHeight / 2 + active.clientHeight / 2;
      track.style.transform = 'translateY(' + (-Math.max(0, target)) + 'px)';
    }
  }
}

function normalizeTitle(s) {
  return String(s || '')
    .replace(/\s*[-–—]\s*(remaster(ed)?|live|radio edit|edit|version).*$/i, '')
    .replace(/\s*\((remaster(ed)?|live|radio edit|edit|version)[^)]*\)\s*$/i, '')
    .trim();
}

function scoreLyricsCandidate(item, title, artist, durationSec) {
  let score = 0;
  const itemTitle = String(item.trackName || '').toLowerCase();
  const itemArtist = String(item.artistName || '').toLowerCase();
  if (itemTitle === title.toLowerCase()) score += 7;
  else if (itemTitle.includes(title.toLowerCase())) score += 4;
  if (itemArtist.includes(artist.toLowerCase())) score += 5;
  if (item.syncedLyrics) score += 4;
  if (item.duration && durationSec) {
    const delta = Math.abs(Number(item.duration) - durationSec);
    score += Math.max(0, 3 - delta / 4);
  }
  return score;
}

async function fetchLyrics(track) {
  const card = $('lyricsCard');
  const box = $('lyrics');
  const hint = $('lyricsHint');
  card.classList.add('hide');
  box.innerHTML = '';
  hint.textContent = '';
  syncedLines = [];
  activeLyricIndex = -1;

  const artist = track.artists?.[0]?.name || '';
  const title = normalizeTitle(track.name);
  const duration = Math.round(track.duration_ms / 1000);
  const all = [];
  const urls = [
    'https://lrclib.net/api/get?' + new URLSearchParams({
      track_name: title,
      artist_name: artist,
      album_name: track.album?.name || '',
      duration
    }),
    'https://lrclib.net/api/search?' + new URLSearchParams({
      track_name: title,
      artist_name: artist
    }),
    'https://lrclib.net/api/search?' + new URLSearchParams({
      q: title + ' ' + artist
    })
  ];

  for (const url of urls) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const data = await res.json();
      if (Array.isArray(data)) all.push(...data);
      else if (data) all.push(data);
    } catch (_) {}
  }

  if (!all.length) return;
  all.sort((a, b) => scoreLyricsCandidate(b, title, artist, duration) - scoreLyricsCandidate(a, title, artist, duration));
  const best = all[0];

  if (best?.syncedLyrics) {
    const lines = parseLRC(best.syncedLyrics);
    if (lines.length) {
      renderSyncedLyrics(lines);
      hint.textContent = '실시간';
      card.classList.remove('hide');
      return;
    }
  }

  if (best?.plainLyrics?.trim()) {
    const pre = document.createElement('div');
    pre.className = 'plainLyrics';
    pre.textContent = best.plainLyrics.trim();
    box.appendChild(pre);
    hint.textContent = '가사';
    card.classList.remove('hide');
  }
}

function setCover(track) {
  const url = track.album?.images?.[0]?.url || '';
  const img = $('cover');
  img.classList.remove('loaded');
  img.removeAttribute('src');
  $('coverGlow').style.backgroundImage = 'none';
  if (!url) return;
  img.onload = () => img.classList.add('loaded');
  img.onerror = () => {
    img.classList.remove('loaded');
    img.removeAttribute('src');
  };
  img.src = url;
  $('coverGlow').style.backgroundImage = 'url("' + url + '")';
}

async function playTrack(track) {
  if (!player) await initPlayer();
  if (!player || !deviceId) throw new Error('웹 플레이어가 아직 준비되지 않았어. RANDOM을 한 번 더 눌러줘.');
  await player.activateElement();
  await api('/me/player/play?device_id=' + encodeURIComponent(deviceId), {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({uris: [track.uri]})
  });
}

async function randomTrack() {
  setStatus('Finding track');
  $('random').disabled = true;

  try {
    let track = null;

    for (let attempt = 0; attempt < 8 && !track; attempt++) {
      const q = seeds[rand(seeds.length)];
      const first = await api('/search?type=track&limit=10&offset=0&q=' + encodeURIComponent(q));
      const total = first?.tracks?.total || 0;
      if (!total) continue;

      const maxOffset = Math.min(Math.max(total - 10, 0), 990);
      const offset = maxOffset ? rand(Math.floor(maxOffset / 10) + 1) * 10 : 0;
      const page = offset === 0
        ? first
        : await api('/search?type=track&limit=10&offset=' + offset + '&q=' + encodeURIComponent(q));

      const items = (page?.tracks?.items || []).filter(t => t?.uri && t?.is_playable !== false);
      if (items.length) track = items[rand(items.length)];
    }

    if (!track) throw new Error('랜덤 곡을 찾지 못했어. 다시 눌러줘.');

    currentTrack = track;
    lastPlaybackPosition = 0;
    setCover(track);
    $('name').textContent = track.name;
    $('artist').textContent = track.artists.map(a => a.name).join(', '); $('headAlbum').textContent = track.album?.name || 'DISCOVERY';
    $('open').href = track.external_urls.spotify;
    currentDuration = track.duration_ms || 0;
    updateTimeline(0, currentDuration);
    fetchLyrics(track);

    setStatus('Starting playback');
    await playTrack(track);
    setStatus('Playing');
  } catch (e) {
    setStatus(e.message || String(e));
  } finally {
    $('random').disabled = false;
  }
}

async function init() {
  if (localStorage.getItem('auth_version') !== AUTH_VERSION) {
    ['access_token','refresh_token','expires_at','t','r','exp'].forEach(k => localStorage.removeItem(k));
    localStorage.setItem('auth_version', AUTH_VERSION);
  }

  $('loginBtn').addEventListener('click', beginLogin);
  $('random').addEventListener('click', randomTrack);
  $('playPause').addEventListener('click', async () => {
    try {
      if (!currentTrack) {
        await randomTrack();
        return;
      }
      if (!player) await initPlayer();
      const state = await player?.getCurrentState();
      if (!state) {
        await playTrack(currentTrack);
        return;
      }
      await player.togglePlay();
      const s = await player.getCurrentState();
      $('playPauseIcon').innerHTML = s && !s.paused ? '<path d="M7 5h4v14H7zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    } catch (e) {
      setStatus(e.message || String(e));
    }
  });
  $('nextRandom').addEventListener('click', randomTrack);
  $('back15').addEventListener('click', async () => {
    if (!currentTrack) return;
    try {
      const s = await player?.getCurrentState();
      if (s) await seekTo(Math.max(0, s.position - 15000));
    } catch (e) { setStatus(e.message); }
  });
  bindSeekBar();
  $('lyricsCard').addEventListener('click', e => {
    if (e.target.classList.contains('lyricLine')) return;
    const card = $('lyricsCard');
    card.classList.toggle('expanded');
    $('lyricsHint').textContent = card.classList.contains('expanded') ? '눌러서 접기' : '눌러서 전체 보기';
  });

  const params = new URLSearchParams(location.search);
  if (params.get('error')) throw new Error('Spotify 로그인 오류: ' + params.get('error'));

  const code = params.get('code');
  if (code) {
    if (params.get('state') !== sessionStorage.getItem('oauth_state')) throw new Error('로그인 검증 실패');
    await exchangeCode(code);
    history.replaceState({}, '', REDIRECT);
  }

  if (await getToken()) {
    $('login').classList.add('hide');
    $('player').classList.remove('hide');
    if (sdkReady) await initPlayer();
  }
}

setInterval(async () => {
  if (!player || isScrubbing) return;
  try {
    const state = await player.getCurrentState();
    if (state) updateTimeline(state.position || 0, state.duration || currentDuration);
  } catch (_) {}
}, 500);

init().catch(e => {
  console.error(e);
  alert(e.message || String(e));
});

</script></body></html>
